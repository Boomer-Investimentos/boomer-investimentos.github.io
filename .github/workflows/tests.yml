name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test -- --watchAll=false
      - name: Backend tests (if present)
        run: |
          if [ -f jest.config.cal.cjs ]; then
            npm run test:cal -- --ci --coverage
          else
            echo "jest.config.cal.cjs not found on this branch yet, skipping backend tests"
          fi
